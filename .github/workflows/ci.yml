name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly rebuild of `main` through the same gates, so base-image patches land without
  # code changes. Scheduled runs always use the default branch.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # ShellCheck is preinstalled on the Ubuntu runners.
      - name: ShellCheck the deploy script
        run: shellcheck deploy/deploy.sh

      - name: Typecheck
        run: pnpm typecheck

      - name: Test the content module (seam 1)
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Test the built site over HTTP (seam 2)
        run: pnpm test:e2e

  container:
    runs-on: ubuntu-latest
    env:
      # Tag the locally built image so it never shadows a pulled `main` image.
      IMAGE_TAG: ci
    steps:
      - uses: actions/checkout@v5

      - name: Build the image and wait for the container to become healthy
        run: docker compose -f compose.yaml -f compose.build.yaml up --detach --wait --wait-timeout 120

      - name: Check the container runs as node, not root
        run: test "$(docker compose exec -T web whoami)" = node

      - name: Check the port is published on 127.0.0.1:3001 only
        run: test "$(docker compose port web 3000)" = 127.0.0.1:3001

      - name: Check the site answers through the published port
        run: curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3001/

      - name: Show container logs
        if: failure()
        run: docker compose logs

      - name: Stop the container
        if: always()
        run: docker compose down

  # Publish only from `main` (push, weekly schedule or manual run), and only after every
  # gate above has passed. Pull requests build the image in `container` but never get here.
  publish:
    needs: [check, container]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/henakers/portfolio
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags are written out by hand rather than with docker/metadata-action, so a `latest`
      # tag can never sneak in through its defaults.
      - name: Compute the short commit SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Always pull the newest base image; the weekly rebuild also skips the layer
          # cache so OS packages are refreshed as well.
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ steps.sha.outputs.short }}
            ${{ env.IMAGE }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
